name: VOLT CI & Forensic Verification Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Build, Test & Evidence Tamper Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap tcpdump libpcap-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify Code Formatting
        run: cargo fmt --check || true

      - name: Run Clippy Linter
        run: cargo clippy -- -D warnings || true

      - name: Build Debug & Release
        run: |
          cargo build --verbose
          cargo build --release --verbose

      - name: Run All Rust Unit & Integration Tests
        run: cargo test --verbose

      - name: Run End-to-End CLI Workflow Test
        run: |
          BINARY="./target/release/volt"
          CASE_ID="CI-TEST-CASE-$(date +%s)"
          
          echo "=== 1. Initialize Case ==="
          $BINARY init \
            --case "$CASE_ID" \
            --investigator "GithubActionsCI" \
            --mode "forensics" \
            --profile "laptop-dell" \
            --agency "Automated QA Division" \
            --warrant "CI-WARRANT-2026" \
            --evidence-id "CI-EVID-001"

          echo "=== 2. Check Status ==="
          $BINARY status

          echo "=== 3. Manual Screenshot Simulation ==="
          $BINARY screenshot --case "$CASE_ID" --label "ci_step_1"

          echo "=== 4. Seal Evidence Vault ==="
          $BINARY seal --case "$CASE_ID"

          echo "=== 5. Generate Forensic Audit Report ==="
          $BINARY report --case "$CASE_ID" --format html
          $BINARY report --case "$CASE_ID" --format markdown

          echo "=== 6. Verify Untampered Evidence ==="
          $BINARY verify "./cases/$CASE_ID"

          echo "=== 7. Export Case Bundle ==="
          $BINARY export --case "$CASE_ID" --format volt

          echo "=== 8. Tamper Detection Test (Must Catch Corruption) ==="
          # Intentionally modify 1 byte in a captured screenshot
          SCREENSHOT_FILE=$(find "./cases/$CASE_ID/screenshots" -name "*.png" | head -n 1)
          if [ -n "$SCREENSHOT_FILE" ]; then
            echo "TAMPERED_BYTE" >> "$SCREENSHOT_FILE"
            if $BINARY verify "./cases/$CASE_ID"; then
              echo "ERROR: volt verify failed to catch tampering!"
              exit 1
            else
              echo "SUCCESS: volt verify correctly detected evidence tampering!"
            fi
          fi

      - name: Upload Release Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: volt-linux-x86_64
          path: target/release/volt
