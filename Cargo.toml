[package]
name = "volt"
version = "0.1.6"
edition = "2021"
authors = ["tuhin-su", "VOLT Security Team"]
description = "Volatile Observation & Logging Terminal — Sandboxed forensic evidence collection and audit environment"
license = "MIT"
readme = "README.md"
repository = "https://github.com/tuhin-su/volt"
documentation = "https://github.com/tuhin-su/volt#readme"
keywords = ["forensics", "sandbox", "security", "terminal", "audit"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
tokio = { version = "1.38", features = ["full"] }
nix = { version = "0.29", features = ["mount", "sched", "signal", "process", "fs", "user", "term", "hostname", "net", "socket", "resource", "mman"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.8", features = ["v4", "fast-rng"] }

[dev-dependencies]
tempfile = "3.10"
